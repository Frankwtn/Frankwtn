<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"  stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"  stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="160" rx="12" fill="#0d1117"/>
  <rect width="860" height="160" rx="12" fill="url(#grad)"/>

  <!-- Border -->
  <rect width="860" height="160" rx="12" fill="none"
    stroke="#21262d" stroke-width="1"/>

  <!-- Accent top bar -->
  <rect x="32" y="0" width="120" height="3" rx="1.5" fill="url(#line)"/>

  <!-- Avatar placeholder circle -->
  <circle cx="72" cy="80" r="40" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
  <text x="72" y="86" text-anchor="middle"
    font-family="'Fira Code',Consolas,monospace" font-size="22"
    fill="#22d3ee">F</text>

  <!-- Name -->
  <text x="132" y="58"
    font-family="'Segoe UI',system-ui,sans-serif" font-size="22" font-weight="700"
    fill="#ffffff">Frank Emmanuel Wuaten</text>

  <!-- Role -->
  <text x="132" y="80"
    font-family="'Fira Code',Consolas,monospace" font-size="13"
    fill="#7d8590">Web Developer & Creative UI Designer</text>

  <!-- Animated taglines -->
  <text x="430" y="102" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#22d3ee" opacity="0">Building for the web.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.05;0.3;0.35;1" dur="9.0s" repeatCount="indefinite"/></text>
  <text x="430" y="102" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#22d3ee" opacity="0">React · Supabase · Tailwind<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3833;0.6333;0.6833;1" dur="9.0s" repeatCount="indefinite"/></text>
  <text x="430" y="102" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#22d3ee" opacity="0">UI/UX + Code.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.7167;0.9667;1.0167;1" dur="9.0s" repeatCount="indefinite"/></text>

  <!-- Divider -->
  <line x1="132" y1="114" x2="828" y2="114"
    stroke="#21262d" stroke-width="1"/>

  <!-- Meta info row -->
  <text x="132" y="134"
    font-family="'Fira Code',Consolas,monospace" font-size="11.5"
    fill="#484f58">
    <tspan fill="#22d3ee">@</tspan>Frankwtn
    <tspan dx="20" fill="#22d3ee">&#9993;</tspan>
    <tspan dx="4">frankwuaten2572@gmail.com</tspan>
    <tspan dx="20" fill="#22d3ee">&#127759;</tspan>
    <tspan dx="4">Batam, Indonesia</tspan>
    <tspan dx="20" fill="#22d3ee">&#128279;</tspan>
    <tspan dx="4">portofolio-project-indol.vercel.app</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="812" y="68" width="8" height="14" rx="1" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>