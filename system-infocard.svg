      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.69;0.75;1" dur="4s" fill="freeze" begin="0.3s"/>
      <text x="440" y="398" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#22d3ee">Grid. Mail</text>
      <text x="514" y="398" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#2a5a7a" letter-spacing="1.5">............................................................</text>
      <text x="978" y="398" text-anchor="end" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#e2e8f0">frankwuaten2572@gmail.com</text>
    </g>

