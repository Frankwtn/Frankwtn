      <text x="538" y="286" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#2a5a7a" letter-spacing="1.5">............................................................</text>
      <text x="978" y="286" text-anchor="end" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#4a7fa5">--</text>
