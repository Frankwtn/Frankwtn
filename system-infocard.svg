      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.24;1" dur="4s" fill="freeze" begin="0.3s"/>
      <text x="440" y="172" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#22d3ee">Origin</text>
      <text x="488" y="172" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#2a5a7a" letter-spacing="1.5">............................................................</text>
      <text x="978" y="172" text-anchor="end" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#e2e8f0">Batam, Indonesia</text>
    </g>

    <!-- Row 4: Education -->
