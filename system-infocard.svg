    <!-- ── SCAN LINE — moves top to bottom ── -->
    <rect x="430" y="60" width="555" height="40" fill="url(#scanLight)">
      <animate attributeName="y" values="60;490;490" keyTimes="0;0.92;1" dur="4s" fill="freeze" begin="0.3s"/>
    </rect>

  </g>

  <!-- ── BOTTOM BAR ── -->
  <line x1="10" y1="494" x2="990" y2="494" stroke="#1a3a5c" stroke-width="1"/>

  <!-- Bottom text -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.90;0.96;1" dur="4s" fill="freeze" begin="0.3s"/>
    <text x="500" y="506" text-anchor="middle"
      font-family="'Fira Code', 'Courier New', monospace"
      font-size="11" fill="#4a7fa5">
      • More about me &amp; projects below in README
    </text>
    <!-- Blinking cursor block -->
    <rect x="758" y="496" width="9" height="12" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
