    <!-- Row 1: Subject -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.14;1" dur="4s" fill="freeze" begin="0.3s"/>
      <text x="440" y="128" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#22d3ee">Subject</text>
      <text x="508" y="128" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#2a5a7a" letter-spacing="1.5">............................................................</text>
      <text x="978" y="128" text-anchor="end" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#e2e8f0">Frank Emmanuel Wuaten</text>
    </g>

    <!-- Row 2: Role -->
