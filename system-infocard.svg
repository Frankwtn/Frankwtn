<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 1000 520" width="1000" height="520">

  <defs>
    <!-- Terminal background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>

    <!-- Scan light gradient — moves top to bottom -->
    <linearGradient id="scanLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip for right panel content -->
    <clipPath id="rightClip">
      <rect x="430" y="50" width="555" height="450"/>
    </clipPath>

    <!-- Clip for terminal window -->
    <clipPath id="termClip">
      <rect x="10" y="10" width="980" height="500" rx="12"/>
    </clipPath>
  </defs>

  <!-- ── TERMINAL WINDOW ── -->
  <!-- Outer border glow -->
  <rect x="8" y="8" width="984" height="504" rx="14"
    fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Main background -->
  <rect x="10" y="10" width="980" height="500" rx="12"
    fill="url(#bgGrad)" clip-path="url(#termClip)"/>

  <!-- Title bar -->
  <rect x="10" y="10" width="980" height="36" rx="12" fill="#0d1b2a"/>
  <rect x="10" y="32" width="980" height="14" fill="#0d1b2a"/>

  <!-- Traffic lights -->
  <circle cx="36" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="28" r="6" fill="#febc2e"/>
  <circle cx="76" cy="28" r="6" fill="#28c840"/>

  <!-- Title bar text -->
  <text x="500" y="32" text-anchor="middle"
    font-family="'Fira Code', 'Courier New', monospace"
    font-size="12" fill="#4a7fa5">
    frankwuaten2572@gmail.com — % ./profile.sh --live
  </text>

  <!-- Divider under title bar -->
  <line x1="10" y1="46" x2="990" y2="46" stroke="#1a3a5c" stroke-width="1"/>

  <!-- ── LEFT PANEL — GIF ── -->
  <image href="https://raw.githubusercontent.com/Frankwtn/Frankwtn/main/system-infocard.gif"
    x="20" y="54" width="395" height="446" preserveAspectRatio="xMidYMid meet"/>

  <!-- Left/right divider -->
  <line x1="425" y1="50" x2="425" y2="505" stroke="#1a3a5c" stroke-width="1"/>

  <!-- ── RIGHT PANEL — SYSTEM.INFO ── -->
