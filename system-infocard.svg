    <text x="448" y="100"
      font-family="'Fira Code', 'Courier New', monospace"
      font-size="11" fill="#ffffff">
      frankwuaten2572@gmail.com
    </text>

    <!-- ── INFO ROWS — revealed by scan ── -->
