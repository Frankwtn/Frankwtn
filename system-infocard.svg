      <text x="440" y="458" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#22d3ee">Grid. Github</text>
      <text x="528" y="458" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#2a5a7a" letter-spacing="1.5">............................................................</text>
      <text x="978" y="458" text-anchor="end" font-family="'Fira Code','Courier New',monospace" font-size="11.5" fill="#e2e8f0">Frankwtn</text>
