    <!-- SYSTEM.INFO header -->
    <text x="440" y="78"
      font-family="'Fira Code', 'Courier New', monospace"
      font-size="11" fill="#4a7fa5" letter-spacing="2">
      SYSTEM.INFO
    </text>

    <!-- LIVE indicator -->
    <circle cx="960" cy="74" r="5" fill="#ff3b3b">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="970" y="78"
      font-family="'Fira Code', 'Courier New', monospace"
      font-size="11" fill="#ff3b3b" letter-spacing="1">
      LIVE
    </text>

    <!-- Email badge -->
