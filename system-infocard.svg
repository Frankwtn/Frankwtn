        Role        = 4ch = 26px  → ends at 14+26 = 40
        Origin      = 6ch = 40px  → ends at 14+40 = 54
        Education   = 9ch = 59px  → ends at 14+59 = 73
        Status      = 6ch = 40px  → ends at 14+40 = 54
        Toolchain   = 9ch = 59px  → ends at 14+59 = 73
        Core. Lang      = 10ch = 66px → 14+66 = 80
        Core. Frontend  = 14ch = 92px → 14+92 = 106
        Core. Backend   = 13ch = 86px → 14+86 = 100
        Core Database   = 13ch = 86px → 14+86 = 100
        Core. Infra     = 11ch = 73px → 14+73 = 87
        - Contact       = 9ch  = 59px → 14+59 = 73
        Grid. Mail      = 10ch = 66px → 14+66 = 80
        Grid. Portofolio= 16ch =106px → 14+106=120
        Grid Linkedin   = 13ch = 86px → 14+86 = 100
        Grid. Github    = 12ch = 79px → 14+79 = 93
        Grid. Facebook  = 14ch = 92px → 14+92 = 106
  -->

